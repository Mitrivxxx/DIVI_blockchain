name: divi

services:
  db:
    image: postgres:16-alpine
    container_name: divi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-DIVI}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: divi-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5021

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-DIVI}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      Jwt__Key: ${JWT_KEY:-change_me_in_env}
      Jwt__Issuer: ${JWT_ISSUER:-DIVI}

      Blockchain__RpcUrl: ${Blockchain__RpcUrl:-https://sepolia.infura.io/v3/replace_me}
      Blockchain__ContractAddress: ${Blockchain__ContractAddress:-0x0000000000000000000000000000000000000000}
      Blockchain__PrivateKey: ${Blockchain__PrivateKey:-}

      PINATA_JWT: ${PINATA_JWT:-}

      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      Minio__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      Minio__Bucket: ${MINIO_BUCKET:-divi-avatars}
      Minio__PublicBaseUrl: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      Minio__UseSsl: ${MINIO_USE_SSL:-false}

      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_DEV:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_PROD:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "5021:5021"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5021/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: divi-frontend-dev
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:5021
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  web:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: divi-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  minio:
    # Community MinIO build — official minio/* / quay.io/minio images are no longer anonymously pullable.
    image: soldevelo/minio:2024.12.18
    container_name: divi-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-divi-avatars}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  blockchain-tools:
    profiles: ["tools"]
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: divi-blockchain-tools
    working_dir: /app
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    volumes:
      - ./blockchain:/app

  hardhat-node:
    profiles: ["tools"]
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: divi-hardhat-node
    working_dir: /app
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app

volumes:
  db_data:
  frontend_node_modules:
  minio_data: